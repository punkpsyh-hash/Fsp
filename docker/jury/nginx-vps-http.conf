# Managed marker: FSP_JURY_RELAY_V1
# Первый этап: только ACME webroot до выпуска сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name fsptest.kolesnikovny.ru;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fsptest-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fsptest-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
