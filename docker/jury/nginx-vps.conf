# Managed marker: FSP_JURY_RELAY_V1
server {
    listen 80;
    listen [::]:80;
    server_name fsptest.kolesnikovny.ru;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fsptest-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fsptest-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fsptest.kolesnikovny.ru;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fsptest-error.log warn;

    ssl_certificate /etc/letsencrypt/live/fsptest.kolesnikovny.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsptest.kolesnikovny.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FSPJuryTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
