# Managed marker: FSP_JURY_RELAY_V1
Match User fspjury-tunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:18470
    PermitOpen none
    GatewayPorts no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    MaxSessions 0

Match all
