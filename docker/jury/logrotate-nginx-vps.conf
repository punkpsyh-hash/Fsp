# Managed marker: FSP_JURY_RELAY_V1
/var/log/nginx/fsptest-error.log {
    daily
    size 1M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -s /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
